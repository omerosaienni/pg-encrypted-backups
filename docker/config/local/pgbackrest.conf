# Local-disk config. The GCS config (docker/config/gcp/) is generated by
# Terraform with the bucket baked in; whichever matches the mode is mounted at
# run time, so a local run never carries GCS stanzas and vice versa.
[global]
repo1-retention-full=6
repo1-retention-full-type=count

[demo]
pg1-path=/var/lib/postgresql/data
pg1-user=postgres
repo1-path=/var/lib/pgbackrest
repo1-type=posix

[demo-encrypted]
pg1-path=/var/lib/postgresql/data
pg1-user=postgres
repo1-path=/var/lib/pgbackrest
repo1-type=posix
repo1-cipher-pass=some-cipher-pass
repo1-cipher-type=aes-256-cbc
